<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>2022年柔佛州选举数据查询系统</title>
    <style>
        :root {
            --primary-color: #1F4E78;
            --secondary-color: #2b6ca3;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-light: #777777;
            --border-color: #e0e0e0;
            --winner-bg: #e6f4ea;
            --winner-text: #1e8e3e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Microsoft YaHei';
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: var(--primary-color);
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .search-container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .search-box {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--primary-color);
        }
        .stats {
            font-size: 0.95rem;
            color: var(--text-light);
        }
        .table-container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            white-space: nowrap;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        .winner-row {
            background-color: #fafdfb;
        }
        .winner-badge {
            display: inline-block;
            background-color: var(--winner-bg);
            color: var(--winner-text);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 8px;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-light);
            font-size: 1.1rem;
        }
        @media (max-width: 768px) {
            th, td { padding: 10px 15px; }
            input[type="text"] { font-size: 1rem; padding: 12px 15px; }
        }
    </style>
</head>

</div>

    const searchInput = document.getElementById('searchInput');
    const tableBody = document.getElementById('tableBody');
    const statsDisplay = document.getElementById('statsDisplay');

    function renderTable(data) {
        tableBody.innerHTML = '';
        
        if (data.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="6"><div class="empty-state">没有找到符合条件的候选人数据，请尝试其他关键词。</div></td></tr>';
            statsDisplay.textContent = `找到 0 条记录`;
            return;
        }

        data.forEach(item => {
            const row = document.createElement('tr');
            if (item.is_winner) row.className = 'winner-row';
            
            const winnerBadge = item.is_winner ? '<span class="winner-badge">当选</span>' : '';
            const majorityText = item.majority ? item.majority.toLocaleString() : '-';

            row.innerHTML = `
                <td><strong>${item.p_code}</strong><br><span style="color:#666;font-size:0.9em">${item.p_name}</span></td>
                <td><strong>${item.n_code}</strong><br><span style="color:#666;font-size:0.9em">${item.n_name}</span></td>
                <td>${item.candidate} ${winnerBadge}</td>
                <td>${item.party}</td>
                <td>${item.votes.toLocaleString()}</td>
                <td><strong>${majorityText}</strong></td>
            `;
            tableBody.appendChild(row);
        });
        
        statsDisplay.textContent = `共找到 ${data.length} 名候选人记录 (总计 239 名)`;
    }

    function handleSearch() {
        const query = searchInput.value.toLowerCase().trim();
        
        if (!query) {
            renderTable(electionData);
            return;
        }

        const filteredData = electionData.filter(item => {
            // Construct a searchable string combining all searchable fields
            const searchableText = `
                ${item.p_code} ${item.p_name} 
                ${item.n_code} ${item.n_name} 
                ${item.candidate} ${item.party}
            `.toLowerCase();
            
            return searchableText.includes(query);
        });

        renderTable(filteredData);
    }

    // Initial render
    renderTable(electionData);

    // Event listener for real-time search
    searchInput.addEventListener('input', handleSearch);
</script>
