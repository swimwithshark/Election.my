        function getPartyClass(partyStr) {
            if (partyStr.includes('希盟')) return 'ph';
            if (partyStr.includes('砂盟')) return 'gps';
            if (partyStr.includes('国盟')) return 'pn';
            if (partyStr.includes('国阵')) return 'bn';
            return 'other';
        }

        function renderSeats(filterText = '') {
            const container = document.getElementById('results');
            container.innerHTML = '';
            
            const lowerFilter = filterText.toLowerCase();
            const filteredSeats = seats.filter(seat => 
                seat.id.toLowerCase().includes(lowerFilter) || 
                seat.nameCh.toLowerCase().includes(lowerFilter) ||
                seat.nameEn.toLowerCase().includes(lowerFilter) ||
                seat.candidates.some(c => c.text.toLowerCase().includes(lowerFilter))
            );

            if (filteredSeats.length === 0) {
                container.innerHTML = '<div style="text-align: center; width: 100%; grid-column: 1 / -1; color: #777; padding: 40px; background: white; border-radius: 8px;">未找到匹配的选区或候选人，请尝试其他关键词。</div>';
                return;
            }

            filteredSeats.forEach(seat => {
                const card = document.createElement('div');
                card.className = 'card';
                
                let html = `<div class="seat-title">
                    <span>${seat.id} ${seat.nameCh}</span>
                    <span class="seat-en">${seat.nameEn}</span>
                </div>`;
                
                seat.candidates.forEach(c => {
                    const cls = c.isWinner ? 'candidate winner' : 'candidate';
                    const partyMatch = c.text.match(/\((.*?)\)/);
                    let partyHtml = '';
                    let textLeft = c.text;
                    
                    if (partyMatch) {
                        const partyCls = getPartyClass(partyMatch[1]);
                        partyHtml = `<div class="badge ${partyCls}">${partyMatch[1]}</div>`;
                        textLeft = textLeft.replace(partyMatch[0], '').trim();
                    }
                    
                    // Split name and votes
                    const parts = textLeft.split(' 得票:');
                    let names = parts[0];
                    let chName = names;
                    let enName = '';
                    if (names.includes(' | ')) {
                        const nameParts = names.split(' | ');
                        chName = nameParts[0];
                        enName = nameParts[1];
                    }
                    
                    const votes = parts.length > 1 ? `${parts[1]} 票` : '';

                    html += `<div class="${cls}">
                        <div style="display:flex; align-items:center; flex: 1;">
                            ${partyHtml} 
                            <div class="name-group">
                                <span class="ch-name">${chName}</span>
                                ${enName ? `<span class="en-name">${enName}</span>` : ''}
                            </div>
                        </div>
                        <div class="vote-count">
                            ${votes} ${c.isWinner ? '<span class="crown" title="胜选" style="margin-left:4px;">👑</span>' : ''}
                        </div>
                    </div>`;
                });
                
                html += `<div class="stats">${seat.stats}</div>`;
                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderSeats(e.target.value);
        });

        renderSeats();
    </script>
</body>
</html>
